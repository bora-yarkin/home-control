<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard harness</title>
<style>html,body{margin:0;height:100%;background:#111}</style>
</head>
<body>
<!-- Loads the real panel with a pretend Home Assistant (mock-hass.js). Nothing is written anywhere: see README.md. -->
<script type="module">
import "/custom_components/home_control/frontend/dashboard-panel.js";
import { makeHass } from "./mock-hass.js";
import { auditSpacing } from "./audit.js";
window.auditSpacing = auditSpacing;
const panel = document.createElement("dashboard-panel");
document.body.appendChild(panel);
const hass = makeHass(new URLSearchParams(location.search));
window.__hass = hass;
panel.hass = hass;

// ?door=ringing | call | security-ringing | security-call shows the call popup of the pretend door station (a camera with a picture), or of a
// guard desk (no camera picture, only the station's audio-wave picture, and nothing to unlock: `can_unlock: false`). The pictures are stand-ins.
const door = new URLSearchParams(location.search).get("door");
if (door) {
  const security = door.startsWith("security");
  const started = () => window.BOOTED && window.UIDEV && window.UIDEV["camera.door_station"];
  const show = () => {
    if (!started()) return setTimeout(show, 200);
    const profile = window.UIDEV["camera.door_station"];
    profile.ix = { ring: "sensor.door_call_status", answer: "button.door_answer", reject: "button.door_hang_up", unlock: "lock.door_front" };
    profile.name = security ? "Building security" : "Door station";
    window.HA.camera.snapshotUrl = () => (security ? "audio-wave.svg" : "door-cam.svg");
    // The call's sound is pretended: the door "plays" two minutes of silence and the microphone "starts", so the popup can be seen as it is
    // when everything works (no sound is recorded or played).
    const silence = () => {
      const bytes = new Uint8Array(44 + 8000 * 120).fill(0x80);
      const view = new DataView(bytes.buffer);
      "RIFF".split("").forEach((c, i) => view.setUint8(i, c.charCodeAt(0)));
      view.setUint32(4, bytes.length - 8, true);
      "WAVEfmt ".split("").forEach((c, i) => view.setUint8(8 + i, c.charCodeAt(0)));
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, 8000, true);
      view.setUint32(28, 8000, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      "data".split("").forEach((c, i) => view.setUint8(36 + i, c.charCodeAt(0)));
      view.setUint32(40, 8000 * 120, true);
      return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    };
    window.HA.signPath = () => Promise.resolve(silence());
    window.IntercomTalk = { available: () => true, errors: {}, start: () => ({ ready: Promise.resolve(), stop() {}, mute() {} }) };
    hass.setState("camera.door_station", null, { access_token: "harness" });
    hass.setState("sensor.door_call_status", door.endsWith("call") ? "call in progress" : "ringing", security ? { can_unlock: false } : {});
  };
  show();
}
</script>
</body>
</html>
