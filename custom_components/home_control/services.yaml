scene_start:
  fields:
    "scene_id":
      required: true
      example: "evening"
      selector:
        text: {}
    "preset":
      selector:
        select:
          options: ["aurora", "candle", "fireplace", "sunset_glow", "twilight", "prism", "galaxy", "lava", "sunrise", "ocean", "forest", "blossom", "ember", "relax"]
    "area":
      selector:
        text: {}
    "lights":
      selector:
        object: {}
    "palette":
      example: "[{\"hs\": [20, 90]}, {\"k\": 2200, \"b\": 60}]"
      selector:
        object: {}
    "speed":
      selector:
        number:
          mode: "box"
          min: 1
          max: 12
          step: 1
    "range":
      selector:
        number:
          mode: "box"
          min: 0
          max: 100
          step: 1
    "brightness":
      selector:
        number:
          mode: "box"
          min: 1
          max: 255
          step: 1
    "spread":
      selector:
        select:
          options: ["x", "y", "z", "radial"]
    "colour_source":
      selector:
        select:
          options: ["palette", "rainbow"]
    "effects":
      example: "[{\"type\": \"pulse\", \"speed\": 4, \"strength\": 60}]"
      selector:
        object: {}
    "looks":
      selector:
        object: {}
    "actions":
      example: "[{\"entity_id\": \"media_player.tv\", \"do\": \"off\"}]"
      selector:
        object: {}
    "fps":
      selector:
        number:
          mode: "box"
          min: 1
          max: 60
          step: 1
    "wake":
      selector:
        boolean: {}

